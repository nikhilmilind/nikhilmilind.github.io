      const KEY_STORE = "ashg2026:key", GOING_STORE = "ashg2026:going";

      const store = {
        get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
        set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
        del(k) { try { localStorage.removeItem(k); } catch (e) {} },
      };
      const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
      const toB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));

      async function deriveKey(pw) {
        const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
        return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(ENC.salt), iterations: ENC.iter, hash: "SHA-256" },
                                       base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
      }
      async function decrypt(key) {
        const buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(ENC.iv) }, key, b64(ENC.data));
        const stream = new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"));
        return JSON.parse(await new Response(stream).text());
      }

      const lockForm = document.getElementById("lock"), msg = document.getElementById("lock-msg");
      lockForm.addEventListener("submit", async ev => {
        ev.preventDefault();
        const pw = document.getElementById("pw").value;
        if (!pw) return;
        msg.className = "small mt-3 text-body-secondary"; msg.textContent = "Unlocking…";
        try {
          const key = await deriveKey(pw);
          const data = await decrypt(key);
          if (document.getElementById("remember").checked)
            store.set(KEY_STORE, toB64(await crypto.subtle.exportKey("raw", key)));
          start(data);
        } catch (e) {
          msg.className = "small mt-3 text-danger"; msg.textContent = "Incorrect password.";
          document.getElementById("pw").select();
        }
      });
      document.getElementById("lock-again").addEventListener("click", ev => {
        ev.preventDefault(); store.del(KEY_STORE); location.reload();
      });

      (async () => {
        const saved = store.get(KEY_STORE);
        if (!saved) return;
        try {
          const key = await crypto.subtle.importKey("raw", b64(saved), "AES-GCM", false, ["decrypt"]);
          start(await decrypt(key));
        } catch (e) { store.del(KEY_STORE); }  // page rebuilt with a new password/salt
      })();

      // ── rendering ──────────────────────────────────────────────────────────
      let DATA, going = {};
      try { going = JSON.parse(store.get(GOING_STORE) || "{}"); } catch (e) {}
      const modal = () => bootstrap.Modal.getOrCreateInstance(document.getElementById("detail"));

      function el(tag, cls, text) {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text != null) e.textContent = text;
        return e;
      }
      const labMark = () => {
        const s = el("span", "lab-mark ms-1"); s.title = "Pritchard lab";
        s.append(el("i", "bi bi-star-fill")); return s;
      };

      function start(data) {
        DATA = data;
        lockForm.hidden = true;
        document.getElementById("app").hidden = false;
        const tabs = document.getElementById("day-tabs");
        const today = new Date().toLocaleDateString("en-CA", { timeZone: "America/Toronto" });
        let idx = Math.max(0, data.days.findIndex(d => d.date === today));
        const saved = Number(sessionStorage.getItem("ashg2026:day"));
        if (!data.days.some(d => d.date === today) && saved < data.days.length) idx = saved || 0;
        data.days.forEach((d, i) => {
          const li = el("li", "nav-item"), a = el("button", "nav-link", d.short);
          a.type = "button";
          a.addEventListener("click", () => showDay(i));
          li.append(a); tabs.append(li);
        });
        showDay(idx);
      }

      function showDay(i) {
        try { sessionStorage.setItem("ashg2026:day", i); } catch (e) {}
        document.querySelectorAll("#day-tabs .nav-link").forEach((a, j) => a.classList.toggle("active", i === j));
        const d = DATA.days[i], root = document.getElementById("day");
        root.replaceChildren();
        for (const b of d.blocks) {
          const slot = el("section", "slot");
          slot.append(el("div", "slot-time", b.kind === "posters" ? `${b.time} · Poster hall` : b.time));
          slot.append(b.kind === "talks" ? sessionRow(b) : posterList(b));
          root.append(slot);
        }
      }

      function pickOf(b) {
        const chosen = going[b.id];
        return b.sessions.some(s => s.id === chosen) ? chosen : b.sessions.find(s => s.recommended).id;
      }

      function sessionRow(b) {
        const row = el("div", "slot-row"), pick = pickOf(b), userChose = going[b.id] === pick;
        for (const s of b.sessions) {
          const c = el("button", "session-card" + (s.id === pick && b.sessions.length > 1 ? " pick" : ""));
          c.type = "button";
          let tag = "";
          if (b.sessions.length > 1) {
            if (s.id === pick) tag = userChose ? "Going" : "Recommended";
            else if (s.recommended) tag = "Recommended";
          }
          c.append(el("div", "tag", tag));
          const t = el("div", "title", s.title);
          if (s.lab) t.append(labMark());
          c.append(t, el("div", "room", s.room));
          c.addEventListener("click", () => openSession(b, s));
          row.append(c);
        }
        return row;
      }

      const POSTERS_SHOWN = 15;
      function posterList(b) {
        const wrap = el("div");
        const list = el("div", "list-group list-group-flush poster-list border-top border-bottom");
        b.posters.forEach((p, k) => {
          const item = el("button", "list-group-item list-group-item-action" + (p.own ? " own" : ""));
          item.type = "button";
          item.append(el("span", "board mono", p.board));
          const t = el("span", "", p.own ? `Your poster — ${p.title}` : p.title);
          if (p.lab && !p.own) t.append(labMark());
          item.append(t);
          item.addEventListener("click", () => openPoster(b, p));
          if (k >= POSTERS_SHOWN) item.hidden = true;
          list.append(item);
        });
        wrap.append(list);
        const extra = b.posters.length - POSTERS_SHOWN;
        if (extra > 0) {
          const more = el("a", "small d-inline-block mt-2", `Show ${extra} more`);
          more.href = "#";
          more.addEventListener("click", ev => {
            ev.preventDefault();
            list.querySelectorAll(".list-group-item[hidden]").forEach(x => x.hidden = false);
            more.remove();
          });
          wrap.append(more);
        }
        return wrap;
      }

      function openSession(b, s) {
        document.getElementById("detail-title").textContent = s.title;
        document.getElementById("detail-meta").textContent = `${b.time} · ${s.room}`;
        const body = document.getElementById("detail-body");
        body.replaceChildren();
        const acc = el("div", "accordion accordion-flush");
        acc.id = "talks";
        s.talks.forEach((t, k) => {
          if (!t.abstract) {
            const row = el("div", "static-item");
            row.append(el("span", "talk-time mono", t.time), document.createTextNode(t.title));
            acc.append(row);
            return;
          }
          const item = el("div", "accordion-item"), h = el("h2", "accordion-header");
          const btn = el("button", "accordion-button collapsed");
          btn.type = "button";
          btn.setAttribute("data-bs-toggle", "collapse");
          btn.setAttribute("data-bs-target", `#talk-${k}`);
          const txt = el("span");
          const ttl = el("span", "", t.title);
          if (t.lab) ttl.append(labMark());
          txt.append(ttl, el("div", "talk-who", t.presenters));
          btn.append(el("span", "talk-time mono flex-shrink-0", t.time), txt);
          h.append(btn);
          const col = el("div", "accordion-collapse collapse");
          col.id = `talk-${k}`;
          col.setAttribute("data-bs-parent", "#talks");
          col.append(el("div", "accordion-body abstract", t.abstract));
          item.append(h, col);
          acc.append(item);
        });
        body.append(acc);

        const footer = document.getElementById("detail-footer"), gb = document.getElementById("going-btn");
        footer.hidden = b.sessions.length < 2;
        const isGoing = going[b.id] === s.id;
        gb.textContent = isGoing ? "Not going" : "Going to this session";
        gb.onclick = () => {
          if (isGoing) delete going[b.id]; else going[b.id] = s.id;
          store.set(GOING_STORE, JSON.stringify(going));
          modal().hide();
          showDay(Number(sessionStorage.getItem("ashg2026:day")) || 0);
        };
        modal().show();
      }

      function openPoster(b, p) {
        document.getElementById("detail-title").textContent = p.title;
        document.getElementById("detail-meta").textContent = `Board ${p.board} · ${b.time}`;
        const body = document.getElementById("detail-body");
        body.replaceChildren(el("div", "talk-who mb-3", p.presenters),
                             el("div", "abstract", p.abstract || "No abstract available."));
        document.getElementById("detail-footer").hidden = true;
        modal().show();
      }
    </script>

  </body>

</html>
