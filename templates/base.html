<!DOCTYPE html>

<html lang="en">

  <head>

    {% block head %}

      <title>{{ config.page_title|e }}</title>

      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <link rel="icon shortcut" type="image/png" href="/static/img/favicon-192.png" sizes="192x192">
      <link rel="icon shortcut" type="image/png" href="/static/img/favicon-512.png" sizes="512x512">
      <link rel="icon shortcut" type="image/svg+xml" href="/static/img/favicon.svg">
      <link rel="apple-touch-icon" type="image/png" href="/static/img/favicon-180.png" sizes="180x180">

      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
      <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

      <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>

      <script>
        MathJax = {
          loader: {
            load: ['[tex]/upgreek', '[tex]/boldsymbol']
          },
          tex: {
            inlineMath: [['$', '$']],
            packages: {
              '[+]': ['upgreek', 'boldsymbol']
            }
          },
          output: {
            font: 'mathjax-newcm'
          },
          svg: {
            fontCache: 'global'
          }
        };
      </script>
      <script src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-svg.js" type="text/javascript" id="MathJax-script" async></script>

      <script src="https://cdn.jsdelivr.net/npm/vega@6"></script>
      <script src="https://cdn.jsdelivr.net/npm/vega-lite@6"></script>
      <script src="https://cdn.jsdelivr.net/npm/vega-embed@7"></script>

      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap" rel="stylesheet">

      <script src=" https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.1.0/js/all.min.js "></script>
      <link href=" https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.1.0/css/fontawesome.min.css " rel="stylesheet">

      <link href="/static/css/base.css" rel="stylesheet">
      <link href="/static/css/code_highlight.css" rel="stylesheet">

    {% endblock head %}

  </head>

  <body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-xxl p-2">
        <a class="navbar-brand" href="/">{{ config.site_name|e }}</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a {% if page is defined and page == "publications" %} class="nav-link active" aria-current="page" {% else %} class="nav-link" {% endif %} href="/{{ config.publications_template }}">Publications</a>
            </li>
            <li class="nav-item">
              <a {% if page is defined and page == "posts" %} class="nav-link active" aria-current="page" {% else %} class="nav-link" {% endif %} href="/{{ config.posts_template }}">Posts</a>
            </li>
            {% for p in pages %}
              <li class="nav-item">
                <a {% if page is defined and p.page == page %} class="nav-link active" aria-current="page" {% else %} class="nav-link" {% endif %} href="{{ p.url }}">{{ p.name|e }}</a>
              </li>
            {% endfor %}
          </ul>
        </div>
      </div>
    </nav>

    <main class="flex-grow-1">

      {% block content %}
      {% endblock %}

    </main>

    <footer>
